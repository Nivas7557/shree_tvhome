# Important instructions:
# - Enable Gradle parallel execution, build cache, and configuration cache to minimize CI build times.
# - Enable AndroidX and full R8 mode for clean code/resource shrinking and smaller APK size.

# Limit Gradle daemon heap to avoid memory pressure on constrained build environments.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Use AndroidX support libraries and full R8 code/resource shrinking.
android.useAndroidX=false
kotlin.code.style=official
kotlin.incremental=true
android.enableR8.fullMode=false
