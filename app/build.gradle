// Important instructions:
// - Derive monotonic versionCode and 0.X.Y versionName automatically from GitHub Actions run number.
// - Sign every debug build with the repository-tracked app/debug.keystore so updates never conflict.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Compute automatic run-based versionCode and 0.X.Y versionName.
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def verMajor = runNumber.intdiv(100)
def verMinor = (runNumber.intdiv(10)) % 10
def verPatch = runNumber % 10
def autoVersionName = "${verMajor}.${verMinor}.${verPatch}"

android {
    namespace 'shree.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "shree.tvhome"
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName autoVersionName
    }

    // Bind debug signing to a single persistent keystore stored inside the repository.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
