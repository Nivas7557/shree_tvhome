plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'shree.tvhome'
    compileSdk 35

    defaultConfig {
        applicationId 'shree.tvhome'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0.0-kt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/**',
                'kotlin/**',
                '**/*.kotlin_builtins',
                '**/*.kotlin_module',
                'DebugProbesKt.bin'
            ]
        }
    }
}
