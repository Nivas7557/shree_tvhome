// Important instructions:
// - Derive monotonic versionCode and 0.X.Y versionName automatically from GitHub Actions run number.
// - Keep dependencies empty and enable R8 shrinking so the APK stays ~300 KB and updates cleanly in-place.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Compute automatic run-based versionCode and 0.X.Y versionName (e.g., run 17 -> 0.1.7, run 42 -> 0.4.2).
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def verMajor = runNumber.intdiv(100)
def verMinor = (runNumber.intdiv(10)) % 10
def verPatch = runNumber % 10
def autoVersionName = "${verMajor}.${verMinor}.${verPatch}"

android {
    namespace 'shree.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "shree.tvhome"
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName autoVersionName
    }

    buildTypes {
        debug {
            if (persistentKeystore.exists()) {
                signingConfig signingConfigs.persistentDebug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (persistentKeystore.exists()) {
                signingConfig signingConfigs.persistentDebug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
