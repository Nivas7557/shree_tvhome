// Important instructions:
// - Derive monotonic versionCode and 0.X.Y versionName automatically from GitHub Actions run number.
// - Let Gradle use ~/.android/debug.keystore so signing matches the persistent CI keystore automatically.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Compute automatic run-based versionCode and 0.X.Y versionName.
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def verMajor = runNumber.intdiv(100)
def verMinor = (runNumber.intdiv(10)) % 10
def verPatch = runNumber % 10
def autoVersionName = "${verMajor}.${verMinor}.${verPatch}"

android {
    namespace 'shree.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "shree.tvhome"
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName autoVersionName
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
