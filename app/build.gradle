// Important instructions:
// - Derive monotonic versionCode and 0.X.Y versionName automatically from GitHub Actions run number.
// - Explicitly bind debug and release signingConfigs to ~/.android/debug.keystore so every CI build shares the exact same signature.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def verMajor = runNumber.intdiv(100)
def verMinor = (runNumber.intdiv(10)) % 10
def verPatch = runNumber % 10
def autoVersionName = "${verMajor}.${verMinor}.${verPatch}"
def persistentKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")
android {
    namespace 'shree.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId "shree.tvhome"
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName autoVersionName
    }
    signingConfigs {
        persistentDebug {
            storeFile persistentKeystore
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            if (persistentKeystore.exists()) {
                signingConfig signingConfigs.persistentDebug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (persistentKeystore.exists()) {
                signingConfig signingConfigs.persistentDebug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
}
