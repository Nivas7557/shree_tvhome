// Important instructions:
// - Single source of truth for repositories and root project name.
// - No hardcoded local paths or forced repository overrides.

// Configure plugin resolution sources for Gradle plugins.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Enforce centralized dependency repository management across the project.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Define root project name and include the application module.
rootProject.name = "shree_tvhome"
include(":app")
